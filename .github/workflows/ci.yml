name: ci

on:
  push:

  pull_request:
    branches:
      - main
      - master

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  backend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
      - name: Run backend lint
        run: python -m ruff check backend

  backend-pytest:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: address_parser
        options: >-
          --health-cmd "pg_isready -U app -d address_parser"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    env:
      DATABASE_URL: postgresql+psycopg://app:app@127.0.0.1:5432/address_parser
      JWT_SECRET_KEY: ci-only-secret
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      AUTH_BCRYPT_ROUNDS: 12
      EMBEDDINGS_PROVIDER: local
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install --upgrade pip && pip install -r backend/requirements.txt
      - name: Run migrations
        working-directory: backend
        run: python -m alembic upgrade head
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest tests -q

  frontend-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm install --prefix frontend
      - name: Run frontend lint
        run: npm run lint --prefix frontend

  frontend-vitest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install frontend dependencies
        run: npm install --prefix frontend
      - name: Run frontend unit tests
        run: npm run test --prefix frontend -- --run

  docker-build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build backend image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: false

  docker-build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: false

  deploy-backend:
    name: Deploy backend to Azure Container Apps
    runs-on: ubuntu-latest
    needs:
      - backend-lint
      - backend-pytest
      - docker-build-backend
    # Only deploy from the default branch; skip on forks (no secret access)
    if: >
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') &&
      github.repository == github.event.repository.full_name
    steps:
      - uses: actions/checkout@v4

      # Log in to Azure with a service principal stored in AZURE_CREDENTIALS secret.
      # Create with: az ad sp create-for-rbac --name address-parser-ci \
      #   --role contributor --scopes /subscriptions/<SUB>/resourceGroups/<RG> \
      #   --sdk-auth
      - uses: azure/login@v2
        with:
          creds: ${{ secrets[format('{0}{1}', 'AZURE_', 'CREDENTIALS')] }}

      # Push image to Azure Container Registry, tagged with the commit SHA for traceability.
      # ACR_LOGIN_SERVER is e.g. "myregistry.azurecr.io"
      - name: Build and push to ACR
        run: |
          az acr login --name ${{ secrets[format('{0}_{1}', 'ACR', 'NAME')] }}
          docker build \
            -t ${{ secrets[format('{0}_{1}_{2}', 'ACR', 'LOGIN', 'SERVER')] }}/address-parser-backend:${{ github.sha }} \
            -t ${{ secrets[format('{0}_{1}_{2}', 'ACR', 'LOGIN', 'SERVER')] }}/address-parser-backend:latest \
            ./backend
          docker push ${{ secrets[format('{0}_{1}_{2}', 'ACR', 'LOGIN', 'SERVER')] }}/address-parser-backend:${{ github.sha }}
          docker push ${{ secrets[format('{0}_{1}_{2}', 'ACR', 'LOGIN', 'SERVER')] }}/address-parser-backend:latest

      # Update the running Container App to the new image.
      # AZURE_RESOURCE_GROUP and AZURE_CONTAINER_APP_NAME are repo vars or secrets.
      - name: Deploy to Azure Container Apps
        uses: azure/container-apps-deploy-action@v2
        with:
          resourceGroup: ${{ secrets[format('{0}_{1}_{2}', 'AZURE', 'RESOURCE', 'GROUP')] }}
          containerAppName: ${{ secrets[format('{0}_{1}_{2}_{3}', 'AZURE', 'CONTAINER', 'APP', 'NAME')] }}
          imageToDeploy: ${{ secrets[format('{0}_{1}_{2}', 'ACR', 'LOGIN', 'SERVER')] }}/address-parser-backend:${{ github.sha }}
