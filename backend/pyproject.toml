[project]
name = "address-enrichment-pipeline-backend"
version = "0.1.0"
description = "Backend for the address enrichment pipeline"
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]
