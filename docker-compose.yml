services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: address_parser_postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: address_parser
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d address_parser"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - address_parser_net

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: address_parser_backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@postgres:5432/address_parser
      JWT_SECRET_KEY: dev-only-change-me
      JWT_ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 15
      REFRESH_TOKEN_EXPIRE_DAYS: 7
      AUTH_BCRYPT_ROUNDS: 12
      AUTH_RATE_LIMIT_PER_MINUTE: 10
      AUTH_RATE_LIMIT_WINDOW_SECONDS: 60
      CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173"]'
      CORS_ALLOW_METHODS: '["GET","POST","OPTIONS"]'
      CORS_ALLOW_HEADERS: '["Authorization","Content-Type","Accept"]'
      EMBEDDINGS_PROVIDER: local
      EMBEDDINGS_MODEL: all-MiniLM-L6-v2
      EMBEDDINGS_DIMENSION: 384
      EMBEDDINGS_TIMEOUT_SECONDS: 30
      EMBEDDINGS_FALLBACK_ENABLED: "true"
      SEED_ADMIN_USERNAME: admin
      SEED_ADMIN_EMAIL: admin@example.com
      SEED_ADMIN_PASSWORD: admin12345
      LLM_LOCAL_PROVIDER: ollama
      LLM_LOCAL_BASE_URL: http://host.docker.internal:11434
      LLM_LOCAL_MODEL: llama3.1:8b
      LLM_LOCAL_TIMEOUT_SECONDS: 60
      GEOCODER_PROVIDER: none
      GEOCODER_BASE_URL: ""
      GEOCODER_TIMEOUT_SECONDS: 15
      USE_LOCAL_MODELS_ONLY: "true"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - address_parser_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: address_parser_frontend
    depends_on:
      backend:
        condition: service_healthy
    environment:
      VITE_API_BASE_URL: http://127.0.0.1:8000
    ports:
      - "5173:5173"
    networks:
      - address_parser_net

volumes:
  postgres_data:

networks:
  address_parser_net:
    driver: bridge
