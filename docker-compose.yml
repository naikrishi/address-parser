services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: address_parser_postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: address_parser
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d address_parser"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
